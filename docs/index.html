<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Studio board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='3' width='12' height='2' fill='%231d1b17'/%3E%3Crect x='2' y='7' width='8' height='2' fill='%23b5562d'/%3E%3Crect x='2' y='11' width='10' height='2' fill='%231d1b17'/%3E%3C/svg%3E">
<link rel="stylesheet" href="board.css">
</head>
<body>
<header class="top">
  <h1>Studio board <span id="project">loading</span></h1>
  <p class="fresh"><span id="fresh">Loading the board…</span> · <a href="stats.html">Stats</a> · <a href="about.html">How the pipeline works</a></p>
</header>

<section class="queue-panel" aria-labelledby="queue-h">
  <div class="queue-head"><h2 id="queue-h">Queue</h2><p id="queue-eta" class="queue-eta"></p></div>
  <details id="ops" class="ops" hidden><summary id="ops-sum"></summary><ul id="ops-list"></ul></details>
  <div id="queue" class="queue-bars" aria-live="polite"></div>
</section>

<section class="now" aria-labelledby="now-h">
  <h2 id="now-h">Working now</h2>
  <ol id="lanes" class="lanes"></ol>
</section>

<section class="tally" id="tally" aria-label="Totals"></section>

<nav class="controls" aria-label="Filter">
  <div class="views" id="views" role="tablist" aria-label="What to show"></div>
  <input id="q" type="search" placeholder="Find" autocomplete="off" aria-label="Find a game">
  <div class="prio-row" data-chips="priority" aria-label="Priority"></div>
</nav>
<div class="tools">
  <div class="expand" role="group" aria-label="Details">
    <button data-expand="all">Expand all</button><button data-expand="none">Collapse all</button>
  </div>
  <details class="filter-menu">
    <summary>Filter <span id="filter-count"></span></summary>
    <div class="filter-grid">
      <fieldset><legend>Stage</legend><div data-chips="stage"></div></fieldset>
      <fieldset><legend>Verdict</legend><div data-chips="verdict"></div></fieldset>
      <fieldset><legend>Worker</legend><div data-chips="worker"></div></fieldset>
      <fieldset><legend>Recent</legend><div data-chips="recent"></div></fieldset>
    </div>
  </details>
  <label class="sort">Sort <select id="sort"><option value="change">Latest change</option><option value="priority">Priority</option><option value="cost">Most invested</option></select></label>
</div>

<ol id="games" class="games"></ol>
<script src="board.js"></script>
</body>
</html>
